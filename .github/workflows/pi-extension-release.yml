name: Pi Extension Release

on:
  push:
    branches:
      - compact-plan-tracker

concurrency:
  group: pi-extension-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: bump
        name: Determine semantic version from Conventional Commits
        run: node .github/scripts/bump-pi-version.mjs

  build-package:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true

      - name: Install workspace dependencies
        run: npm run install:dev

      - name: Build Pi extension and assets
        run: bun run build:pi

      - name: Set extension package version
        working-directory: apps/pi-extension
        run: npm version "${{ needs.version.outputs.version }}" --no-git-tag-version

      - name: Pack Pi extension
        working-directory: apps/pi-extension
        run: bun pm pack --filename "$GITHUB_WORKSPACE/plannotator-pi-extension.tgz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plannotator-pi-extension
          path: plannotator-pi-extension.tgz
          if-no-files-found: error
          retention-days: 1

  publish-release:
    needs: [version, build-package]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plannotator-pi-extension
          path: release-assets
          digest-mismatch: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ct-v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Plannotator Pi Extension CT v${{ needs.version.outputs.version }}
          files: release-assets/plannotator-pi-extension.tgz
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
